spring.application.name=messaging-producer
# kein Webserver, das Programm läuft das Demo-Szenario durch und beendet sich
spring.main.web-application-type=none
spring.main.banner-mode=off

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=3s

# Der Broker bestätigt jede Nachricht (Publisher Confirms) ...
spring.rabbitmq.publisher-confirm-type=correlated
# ... und meldet Nachrichten zurück, die in keiner Queue landen (mandatory + returns)
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
