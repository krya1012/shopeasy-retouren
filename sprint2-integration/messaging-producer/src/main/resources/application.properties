spring.application.name=messaging-producer
# no web server: the program plays the demo scenario and ends
spring.main.web-application-type=none
spring.main.banner-mode=off

# connection to RabbitMQ (default values of the container from the README)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=3s

# The broker confirms every message (publisher confirms) ...
spring.rabbitmq.publisher-confirm-type=correlated
# ... and returns messages that end up in no queue (mandatory + returns)
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# short log lines: time, level, text
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
