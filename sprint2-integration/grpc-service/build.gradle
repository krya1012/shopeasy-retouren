plugins {
    id 'application'
    id 'com.google.protobuf' version '0.10.0'
}

def grpcVersion = '1.85.1'
def protobufVersion = '4.36.2'

dependencies {
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53' // for @Generated in the generated code

    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The protobuf plugin turns the .proto file (src/main/proto) into Java classes during the build:
// the messages (protoc) and the service base classes (the grpc plugin).
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

application {
    mainClass = 'de.shopeasy.grpc.server.ConditionServer'
    // server messages in one line: time, level, text
    applicationDefaultJvmArgs = ['-Djava.util.logging.SimpleFormatter.format=%1$tT %4$s %5$s%n']
}

// The client runs separately from the server: ./gradlew :grpc-service:runClient
tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Starts the gRPC client (the server must be running).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.shopeasy.grpc.client.GrpcClientDemo'
    jvmArgs '-Djava.util.logging.SimpleFormatter.format=%1$tT %4$s %5$s%n'
}
