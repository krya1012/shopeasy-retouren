// Settings shared by all four modules (Gradle basics: a "subproject" is one module with its own build.gradle;
// this file adds the common parts so they are not repeated four times).
subprojects {
    apply plugin: 'java'

    group = 'de.shopeasy'
    version = '1.0'

    repositories {
        mavenCentral()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // Print every test with its name (good for the demo): ./gradlew test --rerun
        testLogging {
            events 'passed', 'failed', 'skipped'
            exceptionFormat 'full'
        }
    }
}
