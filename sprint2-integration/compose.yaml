# RabbitMQ mit Weboberfläche: http://localhost:15672 (Benutzer guest, Passwort guest)
# Start:  podman compose up -d   (oder docker compose up -d)
# Stopp:  podman compose down
services:
  rabbitmq:
    image: docker.io/library/rabbitmq:4-management
    container_name: shopeasy-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
