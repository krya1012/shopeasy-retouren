# RabbitMQ with web page: http://localhost:15672 (user guest, password guest)
# Start:  docker compose up -d   (podman compose needs an extra provider, see README: use podman run)
# Stop:   docker compose down
services:
  rabbitmq:
    image: docker.io/library/rabbitmq:4-management
    container_name: shopeasy-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
