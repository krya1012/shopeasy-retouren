spring.application.name=messaging-consumer
spring.main.web-application-type=none
spring.main.banner-mode=off

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=3s

# Abgelehnte Nachrichten nicht erneut zustellen, sondern in die Fehler-Queue (Dead Letter Queue) geben
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# kurze Log-Zeilen: Uhrzeit, Stufe, Text
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
# keine langen Fehlerausgaben von Spring bei abgelehnten Nachrichten, wir loggen den Grund selbst
logging.level.org.springframework.amqp.listener.ConditionalRejectingErrorHandler=ERROR
