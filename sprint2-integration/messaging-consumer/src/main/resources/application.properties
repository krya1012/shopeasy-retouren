spring.application.name=messaging-consumer
# no web server: this program only listens to RabbitMQ
spring.main.web-application-type=none
spring.main.banner-mode=off

# connection to RabbitMQ (default values of the container from the README)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=3s

# do not deliver rejected messages again, send them to the dead letter queue instead
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# short log lines: time, level, text
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
# no long error output from Spring for rejected messages, we log the reason ourselves
logging.level.org.springframework.amqp.listener.ConditionalRejectingErrorHandler=ERROR
