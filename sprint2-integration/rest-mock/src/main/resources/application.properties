spring.application.name=rest-mock
server.port=8080
# send errors as ProblemDetail (RFC 9457): a standard JSON format with title, status and detail
spring.mvc.problemdetails.enabled=true

# the OpenAPI description is at /v3/api-docs, the page to try the API at /swagger-ui.html (springdoc)
springdoc.swagger-ui.path=/swagger-ui.html
