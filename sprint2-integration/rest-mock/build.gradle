plugins {
    id 'org.springframework.boot' version '4.1.2'
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0' // OpenAPI description and Swagger UI

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The client runs separately from the server: ./gradlew :rest-mock:runClient
tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Starts the REST client (the server must be running).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.shopeasy.restmock.client.RestClientDemo'
}
