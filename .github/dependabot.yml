# Weekly pull requests for outdated dependencies. CI runs on each of them.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /sprint2-integration
    schedule:
      interval: weekly
  - package-ecosystem: composer
    directory: /sprint2-integration/selfservice-portal
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /sprint2-integration/selfservice-portal
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 breaks the Vue SFC compiler (@vue/compiler-sfc 3.5.x cannot resolve imported
      # types such as "interface Props extends PrimitiveProps"). Remove this when Vue supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5 # do not update to a release that is only a few days old
    groups:
      github-actions:
        patterns:
          - "*"
